# Update the Liberty path if Sky130 is installed in a different location.
[project]
root = "../.."

[synth]
top = "mux_2x4"
rtl = ["rtl/mux_2x4.sv"]
liberty = "~/opt/pdk/sky130hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
abc_constraints = "constraints/abc/mux_2x4.abc"
delay_ps = 10000
build_dir = "build/synth/mux_2x4/technology/sky130"

[timing]
top = "mux_2x4"
netlist = "build/synth/mux_2x4/technology/sky130/netlist.v"
liberty = "~/opt/pdk/sky130hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"
sdc = "constraints/sdc/mux_2x4.sdc"
build_dir = "build/timing/mux_2x4/sky130"
